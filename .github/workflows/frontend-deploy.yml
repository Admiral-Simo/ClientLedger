name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Create the .env file from your GitHub Secret
      - name: Create .env file
        run: |
          echo "${{ secrets.PROD_ENV_FILE }}" > .env
          echo "Created .env file successfully"

      - name: Build Next.js app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      # DYNAMIC DEPLOY STEP
      - name: Deploy to S3 bucket
        run: |
          # 1. Export variables from the .env file so the shell can see them
          export $(grep -v '^#' .env | xargs)

          # 2. Use the variable for the bucket name
          echo "Deploying to bucket: $NEXT_PUBLIC_S3_BUCKET_NAME"
          aws s3 sync out/ s3://$NEXT_PUBLIC_S3_BUCKET_NAME --delete
