name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**' # <--- OPTIMIZATION: Only run if frontend files change
  workflow_dispatch:    # <--- FEATURE: Adds a "Run" button in GitHub Actions

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci # 'ci' is faster and safer than 'install' for CI environments

      # 4. Build project
      # CRITICAL NOTE: In production, this cannot be localhost!
      - name: Build Next.js app
        env:
          # You should update this to your real Elastic Beanstalk URL
          NEXT_PUBLIC_API_URL: "http://clientledger-prod.eba-tvjw8ihm.eu-west-3.elasticbeanstalk.com/api"
        run: npm run build

      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      # 6. Deploy to S3
      - name: Deploy to S3 bucket
        # Added --delete to remove old files that no longer exist
        run: aws s3 sync out/ s3://clientledger --delete
